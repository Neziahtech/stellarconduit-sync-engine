name: Sync Engine CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-lint:
    name: Format and Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets --all-features -- -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: fmt-and-lint

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: cargo test --workspace

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: fmt-and-lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks (Criterion / bencher output)
        # Runs benchmarks and prints results to stdout.
        # gh-pages publishing is intentionally omitted here so that PRs from
        # forks do not attempt to write to a branch they cannot access.
        # The upstream maintainers manage benchmark history storage on their end.
        run: cargo bench --bench queue_throughput --bench storage_throughput --bench conflict_detection -- --output-format=bencher 2>&1 | tee bench_output.txt
